<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتالوج أبو عبد الله</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #28231d;
    }

    header {
      background: #171511;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      color: #d8b56a;
      font-size: 42px;
    }

    nav {
      background: white;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      color: #28231d;
      text-decoration: none;
      font-weight: bold;
      margin: 10px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .welcome {
      background: white;
      text-align: center;
      padding: 30px 20px;
      border-radius: 16px;
      margin-bottom: 30px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.10);
    }

    .product img {
      width: 100%;
      max-height: 600px;
      display: block;
      object-fit: contain;
      background: #e8e2d8;
    }

    .product-info {
      padding: 22px;
    }

    .product-info h3 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    .condition {
      display: inline-block;
      background: #eee8dd;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: bold;
    }

    .price {
      color: #9b741f;
      font-size: 24px;
      font-weight: bold;
    }

    .code {
      color: #666;
    }

    .contact {
      margin-top: 30px;
      padding: 25px;
      background: #171511;
      color: white;
      border-radius: 16px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>أبو عبد الله</h1>
    <p>مجوهرات وساعات مختارة بعناية</p>
  </header>

  <nav>
    <a href="#products">المنتجات</a>
    <a href="#contact">التواصل</a>
  </nav>

  <main>
    <section class="welcome">
      <h2>مرحبًا بكم في كتالوج أبو عبد الله</h2>
      <p>منتجات مختارة مع التفاصيل والأسعار.</p>
    </section>

    <h2 id="products">المنتجات</h2>

    <article class="product">
      <img src="IMG_3933.webp" alt="صورة منتج مرواس">

      <div class="product-info">
        <h3>مرواس</h3>
        <p class="condition">الحالة: زيرو</p>
        <p class="price">السعر: 18,500</p>
        <p class="code">رمز المنتج: 5N2056v9</p>
      </div>
    </article>

    <section class="contact" id="contact">
      <h2>للطلب والاستفسار</h2>
      <p>تواصل مع أبو عبد الله لمعرفة المزيد.</p>
    </section>
  </main>

  <footer>
    جميع الحقوق محفوظة — أبو عبد الله
  </footer>

</body>
</html>
